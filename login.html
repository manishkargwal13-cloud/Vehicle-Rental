<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f8f8f5">
    <meta name="description" content="Administrator login for Roam vehicle rentals.">
    <title>Admin login — Roam</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="auth-page">
    <main class="auth-card">
      <a class="brand auth-brand" href="/" aria-label="Back to Roam">
        <span class="brand-mark">r</span>
        <span class="brand-name">roam</span><span class="brand-period">.</span>
      </a>
      <span class="eyebrow muted-eyebrow" id="auth-eyebrow">SECURE ADMIN ACCESS</span>
      <h1 id="auth-title">Welcome back.</h1>
      <p class="auth-description" id="auth-description">Log in to manage your fleet, bookings, and website.</p>
      <form id="auth-form">
        <label class="modal-label">
          Administrator email
          <input name="email" type="email" autocomplete="username" placeholder="you@example.com" required maxlength="254">
        </label>
        <label class="modal-label">
          Password
          <input name="password" type="password" autocomplete="current-password" required maxlength="200">
        </label>
        <label class="modal-label" id="confirm-password-field" hidden>
          Confirm password
          <input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="200">
        </label>
        <p class="auth-error" id="auth-error" role="alert" hidden></p>
        <button class="primary-action" id="auth-submit" type="submit">Log in</button>
      </form>
      <p class="auth-note" id="auth-note" hidden>Your first admin account is saved in your local SQL database. Choose a password with at least 12 characters.</p>
      <a class="back-link" href="/">← Back to the rental site</a>
    </main>
      <script>
      const form = document.querySelector("#auth-form");
      const emailInput = form.elements.email;
      const passwordInput = form.elements.password;
      const confirmInput = form.elements.confirmPassword;
      const confirmField = document.querySelector("#confirm-password-field");
      const submitButton = document.querySelector("#auth-submit");
      const errorMessage = document.querySelector("#auth-error");
      let setupRequired = false;

      async function checkLoginState() {
        try {
          const response = await fetch("/api/auth/status");
          const state = await response.json();
          if (!response.ok) throw new Error(state.error || "Could not check administrator setup.");
          if (state.authenticated) {
            window.location.replace("/?admin=1");
            return;
          }
          setupRequired = state.setupRequired;
          if (setupRequired) {
            document.querySelector("#auth-eyebrow").textContent = "FIRST-TIME SETUP";
            document.querySelector("#auth-title").textContent = "Create your admin account.";
            document.querySelector("#auth-description").textContent = "Set up the account that protects your vehicle fleet, bookings, and website settings.";
            document.querySelector("#auth-note").hidden = false;
            confirmField.hidden = false;
            confirmInput.required = true;
            passwordInput.autocomplete = "new-password";
            passwordInput.minLength = 12;
            submitButton.textContent = "Create admin account";
          }
        } catch (error) {
          showError(error.message);
          submitButton.disabled = true;
        }
      }

      function showError(message) {
        errorMessage.textContent = message;
        errorMessage.hidden = false;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorMessage.hidden = true;
        if (setupRequired && passwordInput.value !== confirmInput.value) {
          showError("The passwords do not match.");
          confirmInput.focus();
          return;
        }
        submitButton.disabled = true;
        try {
          const response = await fetch(setupRequired ? "/api/auth/setup" : "/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: emailInput.value.trim(), password: passwordInput.value }),
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Unable to sign in.");
          window.location.assign("/?admin=1");
        } catch (error) {
          showError(error.message);
          submitButton.disabled = false;
        }
      });

      void checkLoginState();
</script>
  </body>
</html>
